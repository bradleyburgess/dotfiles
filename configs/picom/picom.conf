# Minimal config for anti-tearing
# Set the backend to glx (OpenGL) for VSync.
backend = "glx";

# Enable VSync to synchronize rendering with your monitor's refresh rate.
vsync = true;

# Try different glx-swap-methods if VSync=true alone doesn't work.
# glx-swap-method = 1; # or 2, or 3

corner-radius = 12;

# Optional: Exclude certain windows (like your bar) from being rounded
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
